services:
  # ------------------------------------------
  # 1. Reverse Proxy & Automatic SSL (Caddy)
  # ------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: orbitly-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-orbitly.app}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - orbitly-net

  # ------------------------------------------
  # 2. Next.js Web App
  # ------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: orbitly-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: https://${DOMAIN:-orbitly.app}
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-orbitly.app}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - orbitly-net

  # ------------------------------------------
  # 3. NestJS API Service
  # ------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: orbitly-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbitly}:${POSTGRES_PASSWORD:-orbitly_secret}@postgres:5432/${POSTGRES_DB:-orbitly_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orbitly_redis_secret}
      REDIS_URL: redis://:${REDIS_PASSWORD:-orbitly_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      TOKEN_ENCRYPTION_KEY_V2: ${TOKEN_ENCRYPTION_KEY_V2}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orbitly_minio_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orbitly_minio_secret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-orbitly-media}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:-orbitly.app}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - orbitly-net

  # ------------------------------------------
  # 4. BullMQ Background Worker Daemon
  # ------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: orbitly-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbitly}:${POSTGRES_PASSWORD:-orbitly_secret}@postgres:5432/${POSTGRES_DB:-orbitly_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orbitly_redis_secret}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      TOKEN_ENCRYPTION_KEY_V2: ${TOKEN_ENCRYPTION_KEY_V2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orbitly-net

  # ------------------------------------------
  # 5. MCP Server (AI Agents Bridge)
  # ------------------------------------------
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    container_name: orbitly-mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MCP_PORT: 8000
      ORBITLY_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - orbitly-net

  # ------------------------------------------
  # 6. PostgreSQL 16
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orbitly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbitly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbitly_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orbitly_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbitly} -d ${POSTGRES_DB:-orbitly_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbitly-net

  # ------------------------------------------
  # 7. Redis 7 (In-Memory Queue & Cache)
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orbitly-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-orbitly_redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orbitly_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbitly-net

  # ------------------------------------------
  # 8. MinIO (S3-Compatible Object Storage)
  # ------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: orbitly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-orbitly_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-orbitly_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - orbitly-net

  # ------------------------------------------
  # 9. Automated Database Daily Backup
  # ------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: orbitly-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-orbitly}
      PGPASSWORD: ${POSTGRES_PASSWORD:-orbitly_secret}
      PGDATABASE: ${POSTGRES_DB:-orbitly_prod}
    volumes:
      - backups_data:/backups
    entrypoint: |
      /bin/sh -c '
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S)
          echo "Starting daily PostgreSQL backup: backup_$$DATE.sql.gz"
          pg_dump -Fc | gzip > /backups/orbitly_backup_$$DATE.sql.gz
          echo "Backup completed. Retaining 30 days of archives..."
          find /backups -name "orbitly_backup_*.sql.gz" -mtime +30 -delete
          sleep 86400
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbitly-net

networks:
  orbitly-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  backups_data:
