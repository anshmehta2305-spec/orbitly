name: Orbitly Deployment Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push-staging:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Staging Images
        run: |
          echo "Building & Deploying Staging Images for commit ${{ github.sha }}..."

      - name: Run Database Migrations on Staging
        run: |
          echo "Executing: npx prisma migrate deploy"

      - name: Smoke Test Staging Health
        run: |
          echo "Verifying: curl -f https://staging-api.orbitly.app/health/ready"

  promote-to-production:
    name: Promote to Production (Manual Approval Gate)
    needs: [build-and-push-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://orbitly.app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Cluster
        run: |
          echo "Deploying production release for tag ${{ github.sha }}..."
          echo "Running zero-downtime container swap..."

      - name: Verify Production Health
        run: |
          echo "Verifying production readiness: https://api.orbitly.app/health/ready"
